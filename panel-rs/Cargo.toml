[package]
name = "tmux-revive-panel"
version = "0.0.0"
edition = "2021"
publish = false
description = "tmux-revive's control panel, ported from scripts/panel.sh byte for byte"

[[bin]]
name = "tmux-revive-panel"
path = "src/main.rs"

[dependencies]
libc = "=0.2.191"
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }

[profile.release]
opt-level = 3
